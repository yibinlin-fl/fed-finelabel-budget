# Proposed single-seed learning pilot. NOT executed on V100 locally.
project: fed-finelabel-budget
device: cuda
threads: 2
baselines: [B0, B1]
seeds:
  split: 20261011
  partition: 101
  init: 102
  client_sampling: 103
  query: 104
  training: 105
dataset:
  root: data/cifar100
  train_samples: null
  validation_size: 5000
  validation_samples: null
  test_samples: 0
n_clients: 10
partition:
  type: dirichlet_coarse
  alpha: 0.3
  min_client_samples: 500
  max_attempts: 1000
budget:
  initial_fraction: 0.02
  additional_fractions: [0.02, 0.04]
training:
  rounds_per_stage: 30
  clients_per_round: 10
  local_epochs: 1
  batch_size: 64
  learning_rate: 0.02
  momentum: 0.9
  max_steps: 50
loss:
  aggregation: sample_mean
  fine_weight: 1.0
  coarse_weight: 1.0
evaluation_diagnostics: true
stage_model_policy: continue
query_batch_size: 64
evaluation_batch_size: 64
output: results/p25_v100_b0_b1
